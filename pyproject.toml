[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-copilot"
version = "0.2.0"
description = "Catalog-grounded Arabic/English sales assistant with commercial-claim verification and human approval."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CatalogCopilot Contributors", email = "contributors@localhost"}
]
keywords = ["sales-assistant", "catalog", "arabic-nlp", "verification", "claim-checking", "human-in-the-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Customer Service",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = []

[project.scripts]
catalog-copilot = "catalog_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["catalog_copilot*"]
